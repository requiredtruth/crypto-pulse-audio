name: Publish prepared Android release
on:
  push:
    branches: [main]
    paths: ['release/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepared-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check logic and prepared assets
        run: |
          ./test.sh
          (cd release && sha256sum --check SHA256SUMS)
          unzip -t release/CryptoPulse-Audio-source-v1.1.0.zip
      - name: Verify production live price transport
        run: ./test.sh --stream
      - name: Publish APK, source and specification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(cat release/version)
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" release/*.apk release/*.zip release/spec.md --clobber
          else
            gh release create "$version" release/*.apk release/*.zip release/spec.md --target "$GITHUB_SHA" --title "CryptoPulse Audio $version" --notes-file release/notes.md
          fi
